<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F7F9" id="meta-theme-color" />
    <title>ORTUKILL POS</title>
    <meta name="description" content="Aplikasi Kasir POS modern untuk ORTUKILL (Orang Tua Keliling Kediri) dengan transaksi hari ini, rekap kasir, manajemen stok, dan integrasi Google Sheets." />
    <meta property="og:title" content="ORTUKILL POS" />
    <meta property="og:description" content="Aplikasi Kasir POS modern untuk ORTUKILL (Orang Tua Keliling Kediri) dengan transaksi hari ini, rekap kasir, manajemen stok, dan integrasi Google Sheets." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">
    <script>
      (function () {
        try {
          var isDark = localStorage.getItem('ortukill_theme') === 'dark';
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
          var meta = document.getElementById('meta-theme-color');
          if (meta) {
            meta.setAttribute('content', isDark ? '#1B1B20' : '#F6F7F9');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F6F7F9] dark:bg-[#121215] text-[#0F172A] dark:text-[#F4F4F6] antialiased selection:bg-[#2563EB] dark:selection:bg-[#A855F7] selection:text-white min-h-dvh">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
